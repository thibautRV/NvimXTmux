# ~/.tmux.conf
# Pensé pour ne JAMAIS empiéter sur les raccourcis nvim :
# - le prefix passe de Ctrl-b (qui est "page up" dans vim) à Ctrl-a
# - la navigation entre panes utilise Ctrl-h/j/k/l SANS prefix, exactement
#   comme dans nvim, via vim-tmux-navigator : une seule gestuelle pour
#   "bouger de fenêtre", que ce soit un split nvim ou un pane tmux.

# ===== Prefix =====
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ===== Général =====
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g focus-events on

# Recharger la config sans quitter tmux
bind r source-file ~/.tmux.conf \; display "Config tmux rechargée"

# ===== Découpe des panes : mnémonique comme dans nvim (| et -) =====
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ===== Navigation entre panes, IDENTIQUE à nvim (pas de prefix) =====
# Détecte si le pane actif fait tourner nvim : si oui, on laisse nvim gérer
# Ctrl-hjkl (vim-tmux-navigator prend le relai), sinon tmux change de pane.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# ===== Redimensionner les panes : prefix + HJKL (majuscules, répétable) =====
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ===== Fenêtres (windows) =====
bind c new-window -c "#{pane_current_path}"
bind Tab last-window
bind -n M-p previous-window
bind -n M-n next-window

# ===== Copie en style vi =====
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ===== Sessions =====
bind S choose-tree -Zs
bind X kill-session

# ===== Statusbar =====
set -g status-position top
set -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set -g status-left '#[bold]#S '
set -g status-left-length 20
set -g status-right '#[fg=#89b4fa]%H:%M '
setw -g window-status-current-style 'bold,bg=#89b4fa,fg=#1e1e2e'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-format ' #I:#W '

# ===== Plugins (optionnel, via TPM : https://github.com/tmux-plugins/tpm) =====
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'
# run '~/.tmux/plugins/tpm/tpm'
